services:
  # ── Backend (Node.js API) ──────────────────────────────────────────────────
  - type: web
    name: salestrack-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 30m
      - key: FIREBASE_PROJECT_ID
        value: room-4cf55
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        value: BD0ED9G1sSuUdy-QKBHwU3vu5YA-c62QJHiN2tXpamD258fX8GD93o2A6I6SbDgvd-XU6DjHJkWfT7FSRjVMEX0
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@salestrack.com
      - key: FRONTEND_URL
        sync: false

  # ── Frontend (Static Site) ─────────────────────────────────────────────────
  - type: web
    name: salestrack-frontend
    runtime: static
    buildCommand: npm run build
    staticPublishPath: frontend/dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyAak_2lmhiWHJdKKOVlxSb-gNPyYzkxYCU
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: room-4cf55.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: room-4cf55
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: room-4cf55.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "24195041950"
      - key: VITE_FIREBASE_APP_ID
        value: 1:24195041950:web:1e285e692a9dddc60a898f
      - key: VITE_API_URL
        sync: false
